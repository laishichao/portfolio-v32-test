<script id="work-image-lightbox-js">
(()=>{
  const gallery=[...document.querySelectorAll('main img')].filter(img=>!img.closest('a')&&!img.classList.contains('no-lightbox'));
  if(!gallery.length)return;
  const overlay=document.createElement('div');overlay.className='work-lightbox';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','作品图片放大查看');
  overlay.innerHTML='<button type="button" class="wl-close" aria-label="关闭图片">×</button><button type="button" class="wl-prev" aria-label="上一张">‹</button><img alt=""><button type="button" class="wl-next" aria-label="下一张">›</button><span class="wl-counter"></span>';
  document.body.appendChild(overlay);
  const full=overlay.querySelector('img'),counter=overlay.querySelector('.wl-counter');let current=0,prior=null;
  const show=n=>{current=(n+gallery.length)%gallery.length;let item=gallery[current];full.src=item.currentSrc||item.src;full.alt=item.alt||'作品图片';counter.textContent=(current+1)+' / '+gallery.length};
  const close=()=>{overlay.classList.remove('is-open');document.body.style.overflow='';full.removeAttribute('src');if(prior)prior.focus({preventScroll:true})};
  gallery.forEach((img,index)=>{img.classList.add('work-gallery-clickable');img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大查看：'+(img.alt||'作品图片'));const open=()=>{prior=img;show(index);overlay.classList.add('is-open');document.body.style.overflow='hidden';overlay.querySelector('.wl-close').focus({preventScroll:true})};img.addEventListener('click',open);img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});
  overlay.querySelector('.wl-close').addEventListener('click',close);
  overlay.querySelector('.wl-prev').addEventListener('click',()=>show(current-1));overlay.querySelector('.wl-next').addEventListener('click',()=>show(current+1));
  overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
  document.addEventListener('keydown',e=>{if(!overlay.classList.contains('is-open'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1)});
  let sx=null;overlay.addEventListener('touchstart',e=>{sx=e.touches[0]?.clientX??null},{passive:true});overlay.addEventListener('touchend',e=>{if(sx===null)return;let delta=(e.changedTouches[0]?.clientX??sx)-sx;if(Math.abs(delta)>60)show(current+(delta<0?1:-1));sx=null},{passive:true});
})();
</script>
