<script id="work-image-lightbox-js">
(()=>{
  const gallery=[...document.querySelectorAll('main img')].filter(img=>!img.closest('a')&&!img.classList.contains('no-lightbox'));
  if(!gallery.length)return;
  const overlay=document.createElement('div');overlay.className='work-lightbox';overlay.setAttribute('role','dialog');overlay.setAttribute('aria-modal','true');overlay.setAttribute('aria-label','作品图片放大查看');
  overlay.innerHTML='<div class="wl-viewport"><img alt=""></div><div class="wl-zoom-controls"><button type="button" class="wl-out" aria-label="缩小">−</button><button type="button" class="wl-in" aria-label="放大">+</button><button type="button" class="wl-reset" aria-label="还原缩放" style="font-size:12px;width:52px">还原</button></div><button type="button" class="wl-close" aria-label="关闭图片">×</button><button type="button" class="wl-prev" aria-label="上一张">‹</button><button type="button" class="wl-next" aria-label="下一张">›</button><span class="wl-hint">滚轮 / 双指缩放 · 拖动查看</span><span class="wl-counter"></span>';
  document.body.appendChild(overlay);
  const viewport=overlay.querySelector('.wl-viewport'),full=viewport.querySelector('img'),counter=overlay.querySelector('.wl-counter');
  let current=0,prior=null,scale=1,dx=0,dy=0,prevOverflow='';
  const pointers=new Map();let gesture=null,down=null,lastTap=0;
  const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
  function bounds(){const width=full.getBoundingClientRect().width/(scale||1),height=full.getBoundingClientRect().height/(scale||1);return {x:Math.max(0,(width*scale-viewport.clientWidth)/2),y:Math.max(0,(height*scale-viewport.clientHeight)/2)}}
  function draw(){const b=bounds();dx=clamp(dx,-b.x,b.x);dy=clamp(dy,-b.y,b.y);full.style.transform=`translate(${dx}px,${dy}px) scale(${scale})`;}
  function reset(){scale=1;dx=0;dy=0;pointers.clear();gesture=null;down=null;full.style.transform='';}
  function zoom(next,x=viewport.clientWidth/2,y=viewport.clientHeight/2){next=clamp(next,1,4);const old=scale;const cx=x-viewport.clientWidth/2,cy=y-viewport.clientHeight/2;dx=cx-(cx-dx)*next/old;dy=cy-(cy-dy)*next/old;scale=next;draw()}
  const show=n=>{current=(n+gallery.length)%gallery.length;reset();const item=gallery[current];full.src=item.currentSrc||item.src;full.alt=item.alt||'作品图片';counter.textContent=(current+1)+' / '+gallery.length;};
  const close=()=>{overlay.classList.remove('is-open');document.body.style.overflow=prevOverflow;reset();full.removeAttribute('src');if(prior)prior.focus({preventScroll:true})};
  gallery.forEach((img,index)=>{img.classList.add('work-gallery-clickable');img.tabIndex=0;img.setAttribute('role','button');img.setAttribute('aria-label','放大查看：'+(img.alt||'作品图片'));const open=()=>{prior=img;prevOverflow=document.body.style.overflow;show(index);overlay.classList.add('is-open');document.body.style.overflow='hidden';overlay.querySelector('.wl-close').focus({preventScroll:true})};img.addEventListener('click',open);img.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});
  overlay.querySelector('.wl-close').addEventListener('click',close);
  overlay.querySelector('.wl-prev').addEventListener('click',()=>show(current-1));overlay.querySelector('.wl-next').addEventListener('click',()=>show(current+1));
  overlay.querySelector('.wl-in').addEventListener('click',()=>zoom(scale*1.5));overlay.querySelector('.wl-out').addEventListener('click',()=>zoom(scale/1.5));overlay.querySelector('.wl-reset').addEventListener('click',reset);
  overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
  document.addEventListener('keydown',e=>{if(!overlay.classList.contains('is-open'))return;if(e.key==='Escape')close();if(e.key==='ArrowRight')show(current+1);if(e.key==='ArrowLeft')show(current-1);if(e.key==='+'||e.key==='=')zoom(scale*1.5);if(e.key==='-')zoom(scale/1.5)});
  viewport.addEventListener('wheel',e=>{e.preventDefault();const box=viewport.getBoundingClientRect();zoom(scale*(e.deltaY<0?1.15:1/1.15),e.clientX-box.left,e.clientY-box.top)},{passive:false});
  const coords=e=>({x:e.clientX,y:e.clientY});
  function pinch(){const p=[...pointers.values()];return {dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2}}
  viewport.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    viewport.setPointerCapture(e.pointerId);pointers.set(e.pointerId,coords(e));
    if(pointers.size===1){down={x:e.clientX,y:e.clientY,dx,dy,scale,time:Date.now(),moved:false};gesture=null}
    if(pointers.size===2){const p=pinch();gesture={...p,scale,dx,dy};down=null}
  });
  viewport.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;
    const last=pointers.get(e.pointerId);pointers.set(e.pointerId,coords(e));
    if(pointers.size===2&&gesture){const p=pinch();const next=clamp(gesture.scale*(p.dist/Math.max(1,gesture.dist)),1,4);const rect=viewport.getBoundingClientRect();const cx=gesture.x-rect.left-rect.width/2,cy=gesture.y-rect.top-rect.height/2;scale=next;dx=gesture.dx+(p.x-gesture.x)-cx*(next/gesture.scale-1);dy=gesture.dy+(p.y-gesture.y)-cy*(next/gesture.scale-1);draw()}
    else if(pointers.size===1&&down){const mx=e.clientX-down.x,my=e.clientY-down.y;if(Math.abs(mx)>7||Math.abs(my)>7)down.moved=true;if(scale>1){dx+=e.clientX-last.x;dy+=e.clientY-last.y;draw()}}
  });
  function release(e){if(!pointers.has(e.pointerId))return;const hadTwo=pointers.size>1;pointers.delete(e.pointerId);
    if(!hadTwo&&down&&scale===1&&e.type==='pointerup'){const delta=e.clientX-down.x;if(Math.abs(delta)>65&&Math.abs(e.clientY-down.y)<90)show(current+(delta<0?1:-1));else if(!down.moved&&Date.now()-lastTap<350){const box=viewport.getBoundingClientRect();zoom(2.5,e.clientX-box.left,e.clientY-box.top);lastTap=0}else if(!down.moved)lastTap=Date.now()}
    if(hadTwo&&pointers.size===1){const p=[...pointers.values()][0];down={...p,dx,dy,scale,time:Date.now(),moved:true}}else down=null;
    gesture=null;
  }
  viewport.addEventListener('pointerup',release);viewport.addEventListener('pointercancel',release);
  viewport.addEventListener('dblclick',e=>{if(e.pointerType==='touch')return;const b=viewport.getBoundingClientRect();zoom(scale>1?1:2.5,e.clientX-b.left,e.clientY-b.top)});
  full.addEventListener('load',()=>{if(overlay.classList.contains('is-open'))draw()});
})();
</script>
