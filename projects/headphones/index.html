<header class="case-head"><div><div class="eyebrow">PROJECT 003 / MATERIAL & LIGHT</div><h1>头戴耳机</h1><p class="english">Headphones · Product Visual</p></div>
<div class="case-lead"><p class="capability">材质细节 / 精准布光 / 产品构图</p><p>以深色皮革、金属饰面与温润木纹的质感对照，借由克制的高光和轮廓光，让产品结构在暗部中清晰呈现。</p></div></header>
<figure class="hero-figure"><img src="../../assets/headphone-02.webp" alt="耳机金属饰面与木质台面的横向主视觉" fetchpriority="high" data-full="../../assets/hq-headphone-02.png"><figcaption><strong>01 / 材质与光</strong><span>细腻的反射与层次分明的暗部，在近距离呈现产品质感。</span></figcaption></figure>
<section aria-labelledby="scene-title"><div class="section-divider"><h2 id="scene-title">氛围与空间</h2><span>ENVIRONMENT / 02—03</span></div><div class="scene-grid">
<figure><img src="../../assets/headphone-01.webp" alt="耳机与木凳置于暗色空间" loading="lazy" data-full="../../assets/hq-headphone-01.png"><figcaption><strong>02 / 环境氛围</strong><span>以局部光束和大面积暗部，建立安静而有重量的空间关系。</span></figcaption></figure>
<figure><img src="../../assets/headphone-03.webp" data-full="../../assets/hq-headphone-03.png" alt="耳机与收纳包的材质细节画面" loading="lazy"><figcaption><strong>03 / 细节构图</strong><span>将金属边框、皮革与织物纳入同一画面，突出材质之间的微妙差异。</span></figcaption></figure>
</div></section>
<section aria-labelledby="form-title"><div class="section-divider"><h2 id="form-title">形态与结构</h2><span>PRODUCT / 04—05</span></div><div class="product-grid">
<figure><img src="../../assets/headphone-04.webp" data-full="../../assets/hq-headphone-04.png" alt="耳机完整产品形态白底展示" loading="lazy"><figcaption><strong>04 / 整体形态</strong><span>褪去环境干扰，让头梁弧度、耳罩比例与结构衔接成为视觉重点。</span></figcaption></figure>
<figure><img src="../../assets/headphone-05.webp" data-full="../../assets/hq-headphone-05.png" alt="耳机耳罩衔接和头梁的局部特写" loading="lazy"><figcaption><strong>05 / 结构特写</strong><span>通过极简背景与局部高光，凸显转折、连接和表面质感。</span></figcaption></figure>
</div></section>
